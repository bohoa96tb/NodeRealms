name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Export Godot 4.3 Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & Install Platform 34
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${SDK_DIR}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under ${SDK_DIR}/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3 & Export Templates
        env:
          GODOT_VERSION: "4.3-stable"
          TEMPLATE_DIR: "4.3.stable"
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -f godot.zip

          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          mkdir -p "$TEMPLATE_TARGET"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O templates.tpz
          unzip -q -o templates.tpz -d temp_templates
          if [ -d "temp_templates/templates" ]; then
            mv -f temp_templates/templates/* "$TEMPLATE_TARGET/"
          else
            mv -f temp_templates/* "$TEMPLATE_TARGET/"
          fi
          rm -rf templates.tpz temp_templates

          # Verify key Android templates exist directly in TEMPLATE_TARGET
          test -f "$TEMPLATE_TARGET/android_debug.apk"
          test -f "$TEMPLATE_TARGET/android_release.apk"
          test -f "$TEMPLATE_TARGET/android_source.zip"
          godot --version

      - name: Import Godot Project & Class Cache
        run: |
          timeout 90 godot --headless --import || true

      - name: Generate Debug Keystore & Configure Godot Editor Settings
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_PATH="${KEYSTORE_DIR}/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          rm -f "$KEYSTORE_PATH"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          cat <<EOF > "${CONFIG_DIR}/editor_settings-4.3.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${KEYSTORE_PATH}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Verify Export Templates, Keystore & Editor Settings
        run: |
          echo "HOME=${HOME} ANDROID_HOME=${ANDROID_HOME} JAVA_HOME=${JAVA_HOME}"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ls -la "$HOME/.android/debug.keystore"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Export Debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/NodeRealms-debug.apk
          ls -lh build/NodeRealms-debug.apk

      - name: Export Release AAB (if Release Keystore Secrets exist)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_USER: ${{ secrets.RELEASE_KEYSTORE_USER }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_USER" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "Release secrets detected. Building signed Release AAB..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

            mkdir -p android/build
            unzip -q -o "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip" -d android/build
            touch android/build/.gdignore

            cp export_presets.cfg /tmp/export_presets.cfg.bak
            sed -i 's@^gradle_build/use_gradle_build=.*@gradle_build/use_gradle_build=true@g' export_presets.cfg
            sed -i 's@^gradle_build/export_format=.*@gradle_build/export_format=1@g' export_presets.cfg
            sed -i 's@^keystore/release=.*@keystore/release="/tmp/release.keystore"@g' export_presets.cfg
            sed -i "s@^keystore/release_user=.*@keystore/release_user=\"${RELEASE_KEYSTORE_USER}\"@g" export_presets.cfg
            sed -i "s@^keystore/release_password=.*@keystore/release_password=\"${RELEASE_KEYSTORE_PASSWORD}\"@g" export_presets.cfg

            godot --headless --verbose --export-release "Android" build/NodeRealms-release.aab

            mv /tmp/export_presets.cfg.bak export_presets.cfg
            rm -f /tmp/release.keystore
            ls -lh build/NodeRealms-release.aab
          else
            echo "Release keystore secrets not set. Skipping Release AAB build."
          fi

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NodeRealms-Android
          path: build/*
          if-no-files-found: error
